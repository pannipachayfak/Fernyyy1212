<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Secretary</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #10182d, #29245c);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            padding: 40px 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #b5a5ff;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 32px;
            color: #a99bff;
            margin-bottom: 20px;
        }

        p {
            font-size: 17px;
            color: #d1d5e0;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        .button {
            display: inline-block;
            padding: 15px 40px;
            background: #7569e8;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 17px;
            transition: 0.3s;
        }

        .button:hover {
            background: #978aff;
            transform: scale(1.05);
        }

        .footer {
            margin-top: 50px;
            color: #9ba5c0;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 32px; }
            h2 { font-size: 25px; }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            ✦ MY SECRETARY
        </div>

        <h1>ยินดีต้อนรับสู่</h1>

        <h2>AI Personal Secretary</h2>

        <p>
            ผู้ช่วยส่วนตัวอัจฉริยะของคุณ<br>
            พร้อมช่วยจัดการงาน วางแผนตารางเวลา
            และอำนวยความสะดวกในชีวิตประจำวัน
        </p>

        <a href="dashboard.html" class="button">
            เริ่มต้นใช้งาน →
        </a>

        <div class="footer">
            Powered by Artificial Intelligence
            <br><br>
            © 2026 My Personal Secretary
        </div>

    </div>

</body>
</html>
