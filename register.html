<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมัครใช้งาน | MY SECRETARY</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #141330;
    --bg2: #2a2260;
    --card: rgba(255,255,255,.07);
    --line: rgba(255,255,255,.16);
    --text: #ffffff;
    --muted: #bdb8e6;
    --accent: #7c68e8;
    --accent-hover: #6a55dc;
    --error: #ff9a9a;
    --ok: #8fe3b0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Noto Sans Thai", system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 440px; }
  .brand { text-align: center; color: #a99bff; font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; }
  h1 { text-align: center; font-size: 1.8rem; margin: 0 0 6px; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px; }
  label { display: block; font-weight: 600; margin: 0 0 6px; }
  .field { margin-bottom: 18px; }
  input {
    width: 100%; padding: 12px 14px; font: inherit; color: var(--text);
    background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 12px;
  }
  input::placeholder { color: #8f89c2; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #b6aaff; outline-offset: 2px; }
  input[aria-invalid="true"] { border-color: var(--error); }
  .err { color: var(--error); font-size: .88rem; margin-top: 6px; min-height: 1.2em; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; }
  .check input { width: 18px; height: 18px; margin-top: 4px; accent-color: var(--accent); }
  button {
    width: 100%; margin-top: 8px; padding: 14px; font: inherit; font-weight: 700; color: #fff;
    background: var(--accent); border: 0; border-radius: 999px; cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  .status { text-align: center; margin-top: 14px; min-height: 1.4em; color: var(--ok); }
  .links { text-align: center; margin-top: 20px; color: var(--muted); }
  .links a { color: #cfc7ff; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">✦ MY SECRETARY</div>
  <h1>สมัครใช้งาน</h1>
  <p class="sub">สร้างบัญชีเพื่อเริ่มใช้เลขาส่วนตัวของคุณ</p>

  <form id="regForm" novalidate>
    <div class="field">
      <label for="name">ชื่อ-นามสกุล</label>
      <input id="name" name="name" type="text" autocomplete="name" placeholder="เช่น สมชาย ใจดี">
      <div class="err" id="err-name"></div>
    </div>
    <div class="field">
      <label for="email">อีเมล</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com">
      <div class="err" id="err-email"></div>
    </div>
    <div class="field">
      <label for="password">รหัสผ่าน</label>
      <input id="password" name="password" type="password" autocomplete="new-password" placeholder="อย่างน้อย 8 ตัวอักษร">
      <div class="err" id="err-password"></div>
    </div>
    <div class="field">
      <label for="confirm">ยืนยันรหัสผ่าน</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="กรอกรหัสผ่านอีกครั้ง">
      <div class="err" id="err-confirm"></div>
    </div>
    <div class="field">
      <label class="check" for="agree">
        <input id="agree" type="checkbox">
        <span>ฉันยอมรับข้อกำหนดการใช้งาน</span>
      </label>
      <div class="err" id="err-agree"></div>
    </div>
    <button type="submit">สมัครใช้งาน</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </form>

  <p class="links">มีบัญชีอยู่แล้ว? <a href="dashboard.html">เข้าสู่ระบบ</a> · <a href="index.html">กลับหน้าหลัก</a></p>
</main>

<script>
  const $ = id => document.getElementById(id);
  const fields = ["name", "email", "password", "confirm", "agree"];

  function setError(id, msg) {
    $("err-" + id).textContent = msg;
    const el = $(id);
    if (msg) el.setAttribute("aria-invalid", "true"); else el.removeAttribute("aria-invalid");
    return !msg;
  }

  function validate() {
    const name = $("name").value.trim();
    const email = $("email").value.trim();
    const pw = $("password").value;
    const cf = $("confirm").value;
    let ok = true;
    ok = setError("name", name ? "" : "กรุณากรอกชื่อ-นามสกุล") && ok;
    ok = setError("email", /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? "" : "กรุณากรอกอีเมลให้ถูกต้อง") && ok;
    ok = setError("password", pw.length >= 8 ? "" : "รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร") && ok;
    ok = setError("confirm", cf && cf === pw ? "" : "รหัสผ่านไม่ตรงกัน") && ok;
    ok = setError("agree", $("agree").checked ? "" : "กรุณายอมรับข้อกำหนดก่อนสมัคร") && ok;
    return ok;
  }

  $("regForm").addEventListener("submit", e => {
    e.preventDefault();
    $("status").textContent = "";
    if (!validate()) return;

    // GitHub Pages เป็นเว็บ static ไม่มีฐานข้อมูล
    // ตอนนี้เก็บแค่ชื่อกับอีเมลในเบราว์เซอร์ (ไม่เก็บรหัสผ่าน) เพื่อใช้เดโม
    // ถ้าจะใช้งานจริง ให้ต่อ Firebase Auth หรือ Supabase
    try {
      localStorage.setItem("mySecretaryUser", JSON.stringify({
        name: $("name").value.trim(),
        email: $("email").value.trim()
      }));
    } catch (err) {}

    $("status").textContent = "สมัครสำเร็จ กำลังไปที่ Dashboard...";
    setTimeout(() => { window.location.href = "dashboard.html"; }, 1200);
  });

  fields.forEach(id => $(id).addEventListener("input", () => setError(id, "")));
</script>
</body>
</html>
